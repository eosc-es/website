<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EOSC-ES · Estado del Nodo</title>
<meta name="description" content="Estado de desarrollo del Nodo español de la EOSC Federation / Development status of the Spanish Node of the EOSC Federation">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M13 7a9 9 0 1 0 0 18' fill='none' stroke='%23ff5b7f' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M19 25a9 9 0 1 0 0-18' fill='none' stroke='%23008691' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preload" href="assets/fonts/roboto-latin-300-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/quicksand-latin-300-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <img class="logo" src="assets/eosc-es-prep-logo.png" alt="EOSC-ES-Prep · EOSC Gravity · Funded by the European Union" width="505" height="200">
    <div class="brandtxt"><b>EOSC-ES</b><span data-i18n="brandSub"></span></div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Idioma / Language">
        <button type="button" data-lang="es">ES</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </div>
  </div>
</header>
<nav class="toc" aria-label="Secciones"><div class="wrap" id="toc"></div></nav>

<div class="hero">
  <svg class="ring" viewBox="0 0 100 100" aria-hidden="true"><path d="M42 12a38 38 0 1 0 0 76" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/><path d="M58 88a38 38 0 1 0 0-76" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/></svg>
  <div class="wrap">
    <h1 data-i18n="heroTitle"></h1>
    <p data-i18n="heroText"></p>
    <span class="updated" id="updated"></span>
  </div>
</div>

<main>
  <section id="overview"><div class="wrap">
    <div class="card"><div class="steps" id="steps"></div></div>
    <div class="kpis" id="kpis"></div>
  </div></section>

  <section id="prep" class="band"><div class="wrap">
    <h2 data-i18n="prepTitle"></h2>
    <p class="lead" data-i18n="prepLead"></p>
    <div class="grid2">
      <div class="card"><h3 data-i18n="deliverables"></h3><ul class="list" id="deliverables"></ul></div>
      <div class="card"><h3 data-i18n="timeline"></h3><ul class="tl" id="events"></ul></div>
    </div>
  </div></section>

  <section id="enrolment"><div class="wrap">
    <h2 data-i18n="enrolTitle"></h2>
    <p class="lead" data-i18n="enrolLead"></p>
    <div class="card"><ul class="list" id="criteria"></ul></div>
  </div></section>

  <section id="roles" class="band"><div class="wrap">
    <h2 data-i18n="rolesTitle"></h2>
    <p class="lead" data-i18n="rolesLead"></p>
    <div class="roles" id="rolegrid"></div>
    <div class="note" id="rolesnote"></div>
  </div></section>

  <section id="fcs"><div class="wrap">
    <h2 data-i18n="fcTitle"></h2>
    <p class="lead" data-i18n="fcLead"></p>
    <div class="fcgrid" id="fcgrid"></div>
  </div></section>

  <section id="usecases" class="band"><div class="wrap">
    <h2 data-i18n="ucTitle"></h2>
    <p class="lead" data-i18n="ucLead"></p>
    <div class="card vote" id="votebox" hidden><p id="votetext"></p><a class="btn" href="votacion.html" data-i18n="voteBtn"></a></div>
    <div class="ucgrid" id="ucgrid"></div>
  </div></section>

  <section id="resources"><div class="wrap">
    <h2 data-i18n="resTitle"></h2>
    <p class="lead" data-i18n="resLead"></p>
    <div class="card">
      <div class="filters" id="resfilters"></div>
      <div class="tablewrap"><table>
        <thead><tr><th>ID</th><th data-i18n="thRes"></th><th data-i18n="thProv"></th><th>TRL</th><th data-i18n="thUC"></th><th>FC</th><th data-i18n="thStatus"></th></tr></thead>
        <tbody id="restable"></tbody>
      </table></div>
    </div>
  </div></section>

  <section id="milestones" class="band"><div class="wrap">
    <h2 data-i18n="msTitle"></h2>
    <p class="lead" data-i18n="msLead"></p>
    <div class="legend" id="legend"></div>
    <div class="grid2 msgrid">
      <div class="card"><h3 data-i18n="msHead"></h3><div class="track" id="mstrack"></div></div>
      <div class="card"><h3 data-i18n="ndHead"></h3><ul class="list" id="nodedel"></ul></div>
    </div>
  </div></section>
</main>

<footer>
  <div class="wrap">
    <div class="eu">
      <div class="flag" aria-hidden="true"><svg viewBox="0 0 26 26"><g fill="#FFCC00" id="stars"></g></svg></div>
      <div data-i18n="funding"></div>
    </div>
    <div id="footmeta"></div>
  </div>
</footer>

<script src="data.js"></script>
<script>
(function(){
  "use strict";
  var D = window.EOSC_ES_STATUS;
  var I18N = {
    es:{brandSub:"Nodo español de la EOSC Federation",heroTitle:"Estado de desarrollo del Nodo EOSC español",
      heroText:"Seguimiento público del camino de EOSC-ES hacia su incorporación como Nodo de la EOSC Federation: proyecto preparatorio, criterios de enrolment, roles, Federating Capabilities, casos de uso, recursos y calendario del build-up.",
      updated:"Actualizado el ",overview:"Resumen",prepTitle:"Proyecto preparatorio EOSC-ES-Prep",
      prepLead:"Subvención preparatoria de EOSC Gravity para elaborar el Project Charter del Nodo y preparar la solicitud de enrolment.",
      deliverables:"Entregables",timeline:"Reuniones y eventos",next:"próximo",
      enrolTitle:"Preparación para el enrolment",enrolLead:"Criterios formales exigidos a un Nodo candidato y su estado actual.",
      voteBtn:"Ir a la votación",voteNav:"Votación",rolesTitle:"Roles del Nodo",rolesLead:"Los cinco roles que la EOSC Federation exige a cada Nodo.",tbd:"Por designar",
      fcTitle:"Federating Capabilities",fcLead:"Capacidades que el Nodo implementa para integrarse en la Federación. Plazos en meses desde el inicio del build-up (M1).",
      mandatory:"Obligatoria",mandatory2026:"Obligatoria desde 2026",recommended:"Recomendada",owner:"Responsable técnico",inst:"Institución",deadline:"Plazo",
      ucTitle:"Casos de uso",ucLead:"Cuatro casos inter-Nodo comprometidos para el build-up; dos se demuestran en M12 y dos en M18.",
      lead:"Institución líder",nodes:"Nodos contraparte",dataspace:"Espacio de datos",target:"Demostración",rehearsal:"Ensayo previo",
      resTitle:"Recursos del Node Exchange",resLead:"Cartera inicial de repositorios y servicios, todos en operación con TRL ≥ 7. La primera oleada de onboarding está prevista en M9 (ES-MS3).",
      thRes:"Recurso",thProv:"Proveedor",thUC:"Casos de uso",thStatus:"Onboarding",all:"Todos",
      msTitle:"Hitos y entregables del build-up",msLead:"Calendario del Project Charter (R1): ocho hitos y cinco entregables. M1 es el inicio del build-up tras la aceptación del enrolment.",msHead:"Hitos",ndHead:"Entregables",
      kInst:"instituciones en el consorcio",kRes:"recursos en la cartera inicial",kUC:"casos de uso inter-Nodo",kDel:"entregables preparatorios cerrados",kCrit:"criterios de enrolment cumplidos",kRoles:"roles del Nodo designados",
      funding:"EOSC-ES-Prep se financia mediante las Cascading Grants del proyecto EOSC Gravity, que ha recibido financiación del programa Horizonte Europa de la Unión Europea en virtud del acuerdo de subvención n.º 101188045. Las opiniones expresadas son exclusivamente de sus autores.",
      coord:"Coordinación del proyecto preparatorio",contact:"Contacto",repo:"Código fuente",license:"Contenido bajo licencia CC BY 4.0. Tipografías Quicksand (SIL OFL) y Roboto (Apache 2.0).",
      st:{done:"Completado",progress:"En curso",review:"En revisión",planned:"Planificado",pending:"Pendiente de decisión"}},
    en:{brandSub:"Spanish Node of the EOSC Federation",heroTitle:"Development status of the Spanish EOSC Node",
      heroText:"Public tracker of EOSC-ES on its way to becoming a Node of the EOSC Federation: preparatory project, enrolment criteria, roles, Federating Capabilities, use cases, resources and build-up schedule.",
      updated:"Updated ",overview:"Overview",prepTitle:"EOSC-ES-Prep preparatory project",
      prepLead:"EOSC Gravity preparatory grant to draft the Node Project Charter and prepare the enrolment application.",
      deliverables:"Deliverables",timeline:"Meetings and events",next:"next",
      enrolTitle:"Enrolment readiness",enrolLead:"Formal criteria required from a candidate Node and their current status.",
      voteBtn:"Go to the vote",voteNav:"Vote",rolesTitle:"Node roles",rolesLead:"The five roles the EOSC Federation requires from every Node.",tbd:"TBD",
      fcTitle:"Federating Capabilities",fcLead:"Capabilities the Node implements to integrate with the Federation. Deadlines in months from the start of the build-up (M1).",
      mandatory:"Mandatory",mandatory2026:"Mandatory from 2026",recommended:"Recommended",owner:"Technical owner",inst:"Institution",deadline:"Target",
      ucTitle:"Use cases",ucLead:"Four inter-Node use cases committed for the build-up; two are demonstrated at M12 and two at M18.",
      lead:"Lead institution",nodes:"Counterpart Nodes",dataspace:"Data space",target:"Demonstration",rehearsal:"Rehearsal",
      resTitle:"Node Exchange resources",resLead:"Initial portfolio of repositories and services, all operational at TRL ≥ 7. The first onboarding wave is planned for M9 (ES-MS3).",
      thRes:"Resource",thProv:"Provider",thUC:"Use cases",thStatus:"Onboarding",all:"All",
      msTitle:"Build-up milestones and deliverables",msLead:"Schedule from the Project Charter (R1): eight milestones and five deliverables. M1 is the start of the build-up once enrolment is accepted.",msHead:"Milestones",ndHead:"Deliverables",
      kInst:"institutions in the consortium",kRes:"resources in the initial portfolio",kUC:"inter-Node use cases",kDel:"preparatory deliverables closed",kCrit:"enrolment criteria met",kRoles:"Node roles designated",
      funding:"EOSC-ES-Prep is funded within the Cascading Grants of the EOSC Gravity project, which has received funding from the European Union's Horizon Europe programme under Grant Agreement No. 101188045. Views expressed are those of the authors only.",
      coord:"Preparatory project coordination",contact:"Contact",repo:"Source",license:"Content licensed under CC BY 4.0. Typefaces Quicksand (SIL OFL) and Roboto (Apache 2.0).",
      st:{done:"Completed",progress:"In progress",review:"Under review",planned:"Planned",pending:"Decision pending"}}
  };
  var SECTIONS=[["overview","overview"],["prep","prepTitle"],["enrolment","enrolTitle"],["roles","rolesTitle"],["fcs","fcTitle"],["usecases","ucTitle"],["resources","resTitle"],["milestones","msTitle"]];
  var lang="es", resFilter="all";

  function tx(v){ if(v==null) return ""; return (typeof v==="object") ? (v[lang]||v.es||v.en||"") : String(v); }
  function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function t(k){ return I18N[lang][k]; }
  function badge(s){ return '<span class="badge s-'+esc(s)+'">'+esc(I18N[lang].st[s]||s)+'</span>'; }
  function tbd(v){ return v ? esc(v) : '<span class="tbd">'+esc(t("tbd"))+'</span>'; }
  function fmtDate(d){
    var p=d.split("-"), y=+p[0], m=p[1]?+p[1]-1:null, day=p[2]?+p[2]:null;
    if(m===null) return String(y);
    var dt=new Date(Date.UTC(y,m,day||1));
    var o=day?{day:"numeric",month:"short",year:"numeric",timeZone:"UTC"}:{month:"long",year:"numeric",timeZone:"UTC"};
    return dt.toLocaleDateString(lang==="es"?"es-ES":"en-GB",o);
  }
  function cnt(a,s){return a.filter(function(x){return s.indexOf(x.status)>=0;}).length;}

  function render(){
    document.documentElement.lang=lang;
    document.title = "EOSC-ES · " + (lang==="es"?"Estado del Nodo":"Node status");
    document.querySelectorAll("[data-i18n]").forEach(function(el){ el.textContent=t(el.getAttribute("data-i18n")); });
    document.querySelectorAll("[data-lang]").forEach(function(b){ b.setAttribute("aria-pressed", b.getAttribute("data-lang")===lang); });
    document.getElementById("updated").textContent = t("updated")+fmtDate(D.meta.updated);
    document.getElementById("toc").innerHTML = SECTIONS.map(function(s){return '<a href="#'+s[0]+'">'+esc(t(s[1]))+'</a>';}).join("") + (D.vote&&D.vote.open?'<a class="ext" href="votacion.html">'+esc(t("voteNav"))+'</a>':'');
    var vb=document.getElementById("votebox"); vb.hidden=!(D.vote&&D.vote.open); if(D.vote) document.getElementById("votetext").textContent=tx(D.vote.text);

    var cur=D.phases.current;
    document.getElementById("steps").innerHTML = D.phases.items.map(function(p,i){
      var c = i<cur?"done":(i===cur?"current":"");
      return '<div class="step '+c+'"><div class="dot">'+(i<cur?"✓":(i+1))+'</div><div><div class="t">'+esc(tx(p))+'</div><div class="w">'+esc(tx(p.when))+'</div></div></div>';
    }).join("");

    var named=(D.roles||[]).filter(function(r){return r.name;}).length;
    var k=[
      [D.meta.institutions,"kInst"],
      [D.resources.length,"kRes"],
      [D.usecases.length,"kUC"],
      [cnt(D.deliverables,["done"])+" / "+D.deliverables.length,"kDel"],
      [cnt(D.enrolment,["done"])+" / "+D.enrolment.length,"kCrit"],
      [named+" / "+(D.roles||[]).length,"kRoles"]
    ];
    document.getElementById("kpis").innerHTML = k.map(function(x){return '<div class="card kpi"><div class="n">'+esc(x[0])+'</div><div class="l">'+esc(t(x[1]))+'</div></div>';}).join("");

    document.getElementById("deliverables").innerHTML = D.deliverables.map(function(d){
      return '<li><span class="id">'+esc(d.id)+'</span><div><div class="ti">'+esc(tx(d.title))+(d.due?' <span style="font-size:13px;color:var(--muted)">· '+esc(d.due)+'</span>':'')+'</div><div class="no">'+esc(tx(d.note))+'</div>'+(d.pdf?'<a class="pdf" href="'+esc(d.pdf)+'" target="_blank" rel="noopener">'+esc(d.pdfLabel||"PDF")+'</a>':'')+'</div>'+badge(d.status)+'</li>';
    }).join("");

    var nextShown=false;
    document.getElementById("events").innerHTML = D.events.map(function(e){
      var isNext = !nextShown && e.status!=="done"; if(isNext) nextShown=true;
      return '<li class="'+esc(e.status)+(isNext?' nextup':'')+'"><i></i><div class="d">'+esc(fmtDate(e.date))+(isNext?'<span class="next">'+esc(t("next"))+'</span>':'')+'</div><div class="ev">'+(e.link?'<a href="'+esc(e.link)+'">'+esc(tx(e.title))+'</a>':esc(tx(e.title)))+'</div></li>';
    }).join("");

    document.getElementById("criteria").innerHTML = D.enrolment.map(function(c){
      return '<li><span class="id">'+(c.status==="done"?"✓":"·")+'</span><div><div class="ti">'+esc(tx(c.title))+'</div><div class="no">'+esc(tx(c.note))+'</div></div>'+badge(c.status)+'</li>';
    }).join("");

    document.getElementById("rolegrid").innerHTML = (D.roles||[]).map(function(r){
      return '<div class="card role"><div class="rn">'+esc(tx(r.role))+'</div><div class="who">'+tbd(r.name)+'</div><div>'+badge(r.status)+'</div></div>';
    }).join("");
    document.getElementById("rolesnote").textContent = tx(D.rolesNote);

    document.getElementById("fcgrid").innerHTML = D.fcs.map(function(f){
      return '<div class="card fc"><div class="hd"><span class="code">'+esc(f.id)+'</span>'+badge(f.status)+'</div>'+
        '<div class="nm">'+esc(tx(f.name))+'</div><div class="lv">'+esc(t(f.level))+'</div>'+
        '<div class="bs">'+esc(tx(f.basis))+'</div>'+
        '<dl class="ft"><dt>'+esc(t("owner"))+'</dt><dd>'+tbd(f.owner)+'</dd>'+
        '<dt>'+esc(t("inst"))+'</dt><dd>'+tbd(tx(f.inst))+'</dd>'+
        '<dt>'+esc(t("deadline"))+'</dt><dd>'+esc(tx(f.target))+'</dd></dl></div>';
    }).join("");

    document.getElementById("ucgrid").innerHTML = D.usecases.map(function(u){
      var res = D.resources.filter(function(r){return r.uc.indexOf(u.id)>=0;}).map(function(r){return '<span class="chip" title="'+esc(tx(r.name))+'">'+esc(r.id)+'</span>';}).join("");
      return '<div class="card uc"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="code">'+esc(u.id)+'</span>'+badge(u.status)+'</div>'+
        '<h4>'+esc(tx(u.title))+'</h4><dl>'+
        '<dt>'+esc(t("lead"))+'</dt><dd>'+esc(u.lead)+'</dd>'+
        '<dt>'+esc(t("nodes"))+'</dt><dd>'+esc(tx(u.nodes))+'</dd>'+
        '<dt>'+esc(t("dataspace"))+'</dt><dd>'+esc(tx(u.dataspace))+'</dd>'+
        (u.rehearsal?'<dt>'+esc(t("rehearsal"))+'</dt><dd>'+esc(u.rehearsal)+'</dd>':'')+
        '<dt>'+esc(t("target"))+'</dt><dd><b>'+esc(u.target)+'</b></dd></dl>'+
        '<div class="res">'+res+'</div></div>';
    }).join("");

    var fl=["all"].concat(D.usecases.map(function(u){return u.id;}));
    document.getElementById("resfilters").innerHTML = fl.map(function(f){return '<button type="button" data-f="'+esc(f)+'" aria-pressed="'+(f===resFilter)+'">'+esc(f==="all"?t("all"):f)+'</button>';}).join("");
    document.getElementById("restable").innerHTML = D.resources.filter(function(r){return resFilter==="all"||r.uc.indexOf(resFilter)>=0;}).map(function(r){
      return '<tr><td class="num"><b>'+esc(r.id)+'</b></td><td>'+esc(tx(r.name))+'</td><td>'+esc(r.provider)+'</td><td class="num">'+esc(r.trl)+'</td><td>'+r.uc.map(function(x){return '<span class="chip">'+esc(x)+'</span>';}).join("")+'</td><td>'+r.fc.map(function(x){return '<span class="chip">'+esc(x)+'</span>';}).join("")+'</td><td>'+badge(r.status)+'</td></tr>';
    }).join("");

    document.getElementById("legend").innerHTML = ["done","progress","review","planned","pending"].map(badge).join("");
    var groups=[], idx={};
    D.milestones.forEach(function(m){ if(!(m.m in idx)){idx[m.m]=groups.length;groups.push({m:m.m,items:[]});} groups[idx[m.m]].items.push(m); });
    document.getElementById("mstrack").innerHTML = groups.map(function(g){
      return '<div class="mrow"><div class="m">'+esc(g.m)+'</div><div class="items">'+g.items.map(function(m){
        var dl=(m.d||[]).map(function(x){return '<span class="chip">'+esc(x)+'</span>';}).join("");
        return '<div class="mi"><span class="mid">'+esc(m.id)+'</span><span class="mt">'+esc(tx(m.title))+(dl?' <span class="dl">'+dl+'</span>':'')+'</span>'+badge(m.status)+'</div>';
      }).join("")+'</div></div>';
    }).join("");

    document.getElementById("nodedel").innerHTML = (D.nodeDeliverables||[]).map(function(d){
      return '<li><span class="id">'+esc(d.id)+'</span><div><div class="ti">'+esc(tx(d.title))+'</div><div class="no">'+esc(tx(d.note))+'</div><div class="resp">'+esc(tx(d.resp))+'</div><div style="margin-top:6px">'+badge(d.status)+'</div></div><span class="mm">'+esc(d.m)+'</span></li>';
    }).join("");

    var fm=[esc(t("coord"))+": "+esc(D.meta.coordinator)+" · "+esc(D.meta.project)+" ("+esc(D.meta.grant)+")"];
    if(D.meta.contact) fm.push(esc(t("contact"))+': <a href="mailto:'+esc(D.meta.contact)+'">'+esc(D.meta.contact)+'</a>');
    if(D.meta.repo) fm.push(esc(t("repo"))+': <a href="'+esc(D.meta.repo)+'">'+esc(D.meta.repo)+'</a>');
    fm.push(esc(t("license")));
    document.getElementById("footmeta").innerHTML = fm.join("<br>");
  }

  var s="",i; for(i=0;i<12;i++){var a=i*Math.PI/6;s+='<circle cx="'+(13+8*Math.sin(a)).toFixed(2)+'" cy="'+(13-8*Math.cos(a)).toFixed(2)+'" r="1.2"/>';}
  document.getElementById("stars").innerHTML=s;

  try{ var saved=localStorage.getItem("eoscEsLang"); if(saved==="es"||saved==="en") lang=saved; else lang=(navigator.language||"es").toLowerCase().indexOf("es")===0?"es":"en"; }catch(e){}
  var q=new URLSearchParams(location.search).get("lang"); if(q==="es"||q==="en") lang=q;

  document.addEventListener("click",function(ev){
    var b=ev.target.closest("[data-lang]");
    if(b){ lang=b.getAttribute("data-lang"); try{localStorage.setItem("eoscEsLang",lang);}catch(e){} render(); return; }
    var f=ev.target.closest("[data-f]");
    if(f){ resFilter=f.getAttribute("data-f"); render(); }
  });
  render();
})();
</script>
</body>
</html>
